figma:
  story_key: AISDLC-456
  file_key: fig_AISDLC_Prototypes
  prototype_url: "https://www.figma.com/proto/fig_AISDLC_Prototypes/AI-SDLC-Prototypes?node-id=120-45&mode=view"
  flows:
    - id: flow-happy-autocomplete
      entry_node_id: "120:45"
      steps:
        - node_id: "120:45"
          name: "Écran adresse — champ vide"
          covers_ac: [AC-1]
          interactions:
            - trigger: on_tap
              action: navigate_to
              target_node_id: "120:48"
              duration_ms: 150
        - node_id: "120:48"
          name: "Écran adresse — suggestions affichées"
          covers_ac: [AC-1]
          interactions:
            - trigger: on_tap
              action: navigate_to
              target_node_id: "120:52"
              duration_ms: 150
        - node_id: "120:52"
          name: "Récap adresse OK → bouton paiement"
          covers_ac: [AC-1]
          interactions: []
      covers_acceptance_criteria: [AC-1]
    - id: flow-fallback-manual
      entry_node_id: "120:60"
      steps:
        - node_id: "120:60"
          name: "Écran adresse — erreur Places détectée"
          covers_ac: [AC-2]
          interactions:
            - trigger: on_tap
              action: open_overlay
              target_node_id: "120:65"
              duration_ms: 150
        - node_id: "120:65"
          name: "Overlay — saisie manuelle (5 champs)"
          covers_ac: [AC-2, AC-3, AC-4]
          interactions:
            - trigger: on_tap
              action: navigate_to
              target_node_id: "120:70"
              duration_ms: 150
        - node_id: "120:70"
          name: "Récap adresse manuelle OK"
          covers_ac: [AC-3]
          interactions: []
        - node_id: "120:72"
          name: "Overlay — erreur CP invalide"
          covers_ac: [AC-4]
          interactions:
            - trigger: on_tap
              action: close_overlay
              target_node_id: "120:65"
              duration_ms: 150
      covers_acceptance_criteria: [AC-2, AC-3, AC-4]
  design_system_version: "1.3.0"
  open_questions: []
  status: ready_for_code
