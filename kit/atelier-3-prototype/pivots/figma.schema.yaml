$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "aisdlc/pivots/figma.schema.yaml"
title: "FigmaDeliverable"
description: >
  Sortie du squad Prototype. Consommé par le squad Code (bout de chaîne).
  Un fichier par story : docs/prototype/<story-key>/figma.yaml
type: object
required: [figma]
properties:
  figma:
    type: object
    required: [story_key, file_key, prototype_url, flows, design_system_version, status]
    additionalProperties: false
    properties:
      story_key:
        type: string
        pattern: "^AISDLC-[0-9]+$"
      file_key:
        type: string
        description: "file_key Figma du fichier `AISDLC — Prototypes`"
      prototype_url:
        type: string
        format: uri
        description: "Lien de partage view-only"
      flows:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, entry_node_id, steps, covers_acceptance_criteria]
          properties:
            id:
              type: string
              pattern: "^flow-[a-z0-9-]+$"
            entry_node_id: {type: string}
            steps:
              type: array
              minItems: 1
              items:
                type: object
                required: [node_id, name]
                properties:
                  node_id: {type: string}
                  name: {type: string}
                  covers_ac:
                    type: array
                    items: {type: string, pattern: "^AC-[0-9]+$"}
                  interactions:
                    type: array
                    items:
                      type: object
                      required: [trigger, action, target_node_id]
                      properties:
                        trigger:
                          type: string
                          enum: [on_tap, on_hover, on_drag]
                        action:
                          type: string
                          enum: [navigate_to, open_overlay, close_overlay]
                        target_node_id: {type: string}
                        duration_ms:
                          type: integer
                          default: 150
            covers_acceptance_criteria:
              type: array
              description: "AC couverts par ce flow (union des covers_ac des steps)"
              items: {type: string, pattern: "^AC-[0-9]+$"}
      design_system_version:
        type: string
        description: "Version publiée de la bibliothèque `AI SDLC DS`, ex: 1.3.0"
      open_questions:
        type: array
        items: {type: string}
      status:
        type: string
        enum: [in_progress, ready_for_code]
