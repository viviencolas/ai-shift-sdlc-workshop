name: Publier le site (GitHub Pages)

# Site combiné : le guide à la racine (comme aujourd'hui) et la démo de l'application dans /application/.
# Le déploiement n'a lieu que sur main ; les pull requests exécutent seulement tests et build.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "application-notion-like/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application-notion-like/package-lock.json

      - name: Installer, tester, construire la version statique
        working-directory: application-notion-like
        run: |
          npm ci
          npm test
          npm run build:static

      - name: Assembler le site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/application-notion-like
          mkdir _site/application
          cp -r application-notion-like/dist-static/. _site/application/
          test -f _site/index.html
          test -f _site/guide-participant/index.html
          test -f _site/application/index.html
          grep -q 'content="local"' _site/application/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
